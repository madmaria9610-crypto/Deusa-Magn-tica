<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deusa Magnética</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C9A84C;
    --gold-light: #F0D080;
    --gold-bright: #FFE566;
    --diamond: #E8F4FF;
    --deep: #080810;
    --velvet: #0D0D1A;
  }

  body {
    background-color: var(--deep);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--gold-light);
  }

  /* Velvet texture background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(120, 80, 10, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(100, 60, 5, 0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(80, 50, 5, 0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Sparkle particles */
  .sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold-bright);
    border-radius: 50%;
    animation: sparkleFloat linear infinite;
    opacity: 0;
  }
  @keyframes sparkleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* Header / Title */
  .header {
    text-align: center;
    margin-bottom: 44px;
    animation: fadeDown 1s ease forwards;
  }

  .crown {
    font-size: 2.2rem;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 0 12px rgba(201,168,76,0.8));
    animation: crownPulse 3s ease-in-out infinite;
  }
  @keyframes crownPulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(201,168,76,0.7)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px rgba(255,229,102,0.9)); transform: scale(1.08); }
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #8B6914 0%, #C9A84C 25%, #F0D080 50%, #FFE566 65%, #C9A84C 80%, #8B6914 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 20px rgba(201,168,76,0.4));
    position: relative;
  }

  .title-shine {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.85rem, 3.5vw, 1.05rem);
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 10px;
    opacity: 0.75;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0;
    opacity: 0.6;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider-gem {
    font-size: 0.7rem;
    color: var(--gold-bright);
    filter: drop-shadow(0 0 6px rgba(255,229,102,0.8));
  }

  /* Profile photo placeholder */
  .photo-ring {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 28px;
    animation: fadeDown 1.2s ease forwards;
  }
  .photo-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #8B6914, #F0D080, #FFE566, #C9A84C, #8B6914, #F0D080, #8B6914);
    animation: rotateBorder 6s linear infinite;
    z-index: 0;
  }
  @keyframes rotateBorder {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .photo-inner {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1020, #0d0d1a);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .photo-placeholder {
    font-size: 3.5rem;
    filter: drop-shadow(0 0 10px rgba(201,168,76,0.6));
  }

  /* Social icons */
  .socials {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    animation: fadeUp 1.4s ease forwards;
  }
  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.4);
    background: rgba(201,168,76,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .social-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .social-btn:hover::before { opacity: 1; }
  .social-btn:hover {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(201,168,76,0.3), inset 0 0 10px rgba(201,168,76,0.1);
    transform: translateY(-2px);
  }
  .social-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--gold);
  }

  /* Link buttons */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeUp 1.6s ease forwards;
  }

  .link-btn {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: rgba(10, 8, 20, 0.8);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.35s ease;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.05), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .link-btn:hover::before {
    transform: translateX(100%);
  }
  .link-btn:hover {
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 24px rgba(201,168,76,0.15), 0 0 1px rgba(255,229,102,0.3);
    transform: translateY(-1px);
    background: rgba(15, 10, 28, 0.9);
  }
  .link-btn::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .link-btn:hover::after { opacity: 1; }

  .link-icon {
    width: 44px;
    height: 44px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.4rem;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border: 1px solid rgba(201,168,76,0.2);
  }
  .link-text {
    flex: 1;
  }
  .link-title {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    display: block;
  }
  .link-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    color: rgba(201,168,76,0.5);
    letter-spacing: 0.05em;
    margin-top: 2px;
    display: block;
  }
  .link-arrow {
    color: rgba(201,168,76,0.4);
    font-size: 1rem;
    transition: transform 0.3s, color 0.3s;
  }
  .link-btn:hover .link-arrow {
    transform: translateX(4px);
    color: var(--gold);
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    margin-top: 52px;
    text-align: center;
    opacity: 0.3;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Sparkle particles -->
<div class="sparkles" id="sparkles"></div>

<div class="container">

  <!-- Photo -->
  <div class="photo-ring" style="animation-delay:0.2s">
    <div class="photo-inner">
      <span class="photo-placeholder">👑</span>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1 class="title">Deusa<br>Magnética</h1>
    <p class="title-shine">✦ seu poder, sua essência ✦</p>
  </div>

  <!-- Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-gem">◆</span>
    <div class="divider-line"></div>
  </div>

  <!-- Social icons -->
  <div class="socials">
    <a href="https://instagram.com/SEU_USUARIO" class="social-btn" target="_blank" title="Instagram">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
    </a>
  </div>

  <!-- Links -->
  <div class="links">

    <a href="https://SEU_LINK_DO_CURSO.com" class="link-btn" target="_blank">
      <div class="link-icon">💎</div>
      <div class="link-text">
        <span class="link-title">Meu Curso / Produto</span>
        <span class="link-sub">Acesse agora e transforme sua vida</span>
      </div>
      <span class="link-arrow">›</span>
    </a>

    <a href="https://instagram.com/SEU_USUARIO" class="link-btn" target="_blank">
      <div class="link-icon">✨</div>
      <div class="link-text">
        <span class="link-title">Instagram</span>
        <span class="link-sub">Me siga para mais conteúdo</span>
      </div>
      <span class="link-arrow">›</span>
    </a>

  </div>

  <div class="footer">Deusa Magnética &nbsp;◆&nbsp; Todos os direitos reservados</div>

</div>

<script>
  // Generate sparkles
  const sparklesContainer = document.getElementById('sparkles');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.width = s.style.height = (Math.random() * 3 + 1) + 'px';
    s.style.animationDuration = (Math.random() * 8 + 6) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    // Some sparkles are more golden
    if (Math.random() > 0.5) s.style.background = '#FFE566';
    else s.style.background = '#E8F4FF';
    sparklesContainer.appendChild(s);
  }
</script>

</body>
</html>
